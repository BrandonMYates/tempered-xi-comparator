name = "TemperedXiComparator"
defaultTargets = ["Challenge", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

# The proof development. Palomar requires a credential-free public URL and a
# full 40-char lowercase SHA.
[[require]]
name = "XiLab"
git = "https://github.com/BrandonMYates/xilab.git"
rev = "4d24c74c3834b3f47a84110d8b864e3e50eacd7f"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
